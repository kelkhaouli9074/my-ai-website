
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080808">
  <title>MY AI — Your Personal AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <aside class="sidebar">
      <h2>MY AI</h2>
      <button id="new-chat-btn">+ New Chat</button>

      <nav>
        <button class="nav-item active">AI Chat</button>
        <button class="nav-item" id="image-btn">Image Generator</button>
        <button class="nav-item" id="video-btn">Video Generator</button>
      </nav>

      <div class="sidebar-bottom">
        <span>MY AI Assistant</span>
      </div>
    </aside>

    <section class="chat-area">
      <header class="topbar">
        <strong>MY AI</strong>
        <span>Personal AI Assistant</span>
      </header>

      <div id="chat-messages" class="messages">
        <div class="welcome" id="welcome">
          <h1>What can I help you with?</h1>
          <p>Ask anything. Let's get started.</p>
        </div>
      </div>

      <form id="chat-form" class="composer">
        <textarea id="message-input"
          placeholder="Message MY AI..."
          rows="1"></textarea>
        <button type="submit" id="send-btn">↑</button>
      </form>

      <p class="disclaimer">
        MY AI can make mistakes. Check important information.
      </p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
