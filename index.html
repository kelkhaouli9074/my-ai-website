
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1017">

  <title>MY AI — Intelligent Assistant</title>

  <link rel="stylesheet" href="/style.css">

  <!-- MathJax -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['\\(', '\\)'], ['$', '$']],
        displayMath: [['\\[', '\\]'], ['$$', '$$']]
      },
      options: {
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
      }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>

<body>

<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="main-sidebar">

    <div class="brand">
      <div class="brand-icon">M</div>
      <span>MY AI</span>
      <button id="close-sidebar" class="sidebar-close" type="button">×</button>
    </div>

    <button id="new-chat-btn" class="new-chat-btn" type="button">
      <span class="plus">＋</span>
      <span>New chat</span>
    </button>

    <!-- Recent chats inserted by app.js -->

    <div class="sidebar-navigation">

      <button class="sidebar-nav-btn" id="open-settings" type="button">
        <span>⚙</span>
        <span>Settings</span>
      </button>

      <button class="sidebar-nav-btn" id="open-about" type="button">
        <span>ⓘ</span>
        <span>About Us</span>
      </button>

    </div>

    <div class="sidebar-spacer"></div>

    <button id="personal-account" class="personal-account" type="button">
      <div class="profile-avatar">M</div>

      <div class="profile-info">
        <strong>Personal Account</strong>
        <span id="sidebar-account-email">Not signed in</span>
      </div>

      <span class="profile-arrow">›</span>
    </button>

  </aside>

  <div id="sidebar-overlay" class="sidebar-overlay"></div>


  <!-- MAIN CONTENT -->
  <main class="main">

    <!-- TOP BAR -->
    <header class="topbar">

      <div class="mobile-brand">
        <button id="open-sidebar" class="menu-toggle" type="button" aria-label="Open menu">
          ☰
        </button>

        <div class="brand-icon">M</div>
        <span>MY AI</span>
      </div>

      <div class="topbar-center">
        <span>AI Workspace</span>
      </div>

      <div class="account-area">

        <span id="credits-display">Credits: --</span>

        <button id="google-login" type="button">
          Sign in with Google
        </button>

        <button id="google-logout" type="button" style="display:none">
          Logout
        </button>

        <span id="account-email"></span>

      </div>

    </header>


    <!-- CHAT MESSAGES -->
    <section id="chat-messages" class="chat-messages">

      <div class="welcome-panel">
        <div class="welcome-icon">M</div>

        <h1>Welcome to MY AI</h1>

        <p>
          Your intelligent assistant. Ask questions, explore ideas,
          and discover new possibilities.
        </p>

        <div class="suggestions">

          <button class="suggestion-btn" type="button">
            Explain a difficult topic
          </button>

          <button class="suggestion-btn" type="button">
            Help me with my studies
          </button>

          <button class="suggestion-btn" type="button">
            Write something for me
          </button>

          <button class="suggestion-btn" type="button">
            Give me creative ideas
          </button>

        </div>
      </div>

    </section>


    <!-- COMPOSER -->
    <footer class="chat-footer">

      <!-- VOICE SETTINGS -->
      <div class="voice-settings-wrapper">

        <button
          id="voice-settings-toggle"
          class="voice-settings-toggle"
          type="button">
          ⚙ Voice settings
        </button>

        <div id="voice-settings-panel" class="voice-settings-panel" style="display:none">

          <label for="voice-language">Language</label>

          <select id="voice-language">
            <option value="ar">Arabic</option>
            <option value="darija">Moroccan Darija</option>
            <option value="en">English</option>
            <option value="fr">French</option>
            <option value="es">Spanish</option>
          </select>

          <label for="voice-choice">Voice</label>

          <select id="voice-choice">
            <option value="default">Default voice</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
          </select>

          <button id="preview-voice-btn" type="button">
            Preview voice
          </button>

          <button id="voice-output-btn" type="button">
            Enable voice output
          </button>

          <button id="stop-voice-btn" type="button">
            Stop voice
          </button>

        </div>

      </div>


      <!-- IMAGE PREVIEW -->
      <div id="image-preview" class="image-preview" style="display:none">
        <img id="preview-img" src="" alt="Selected image">

        <button id="remove-image" type="button" aria-label="Remove image">
          ×
        </button>
      </div>


      <!-- CHAT FORM -->
      <form id="chat-form" class="chat-form">

        <input
          id="image-input"
          type="file"
          accept="image/*"
          hidden
        >

        <button
          id="attach-btn"
          type="button"
          aria-label="Attach image">
          ＋
        </button>

        <textarea
          id="message-input"
          rows="1"
          placeholder="Message MY AI..."
          autocomplete="off"
        ></textarea>

        <button
          id="voice-input-btn"
          type="button"
          aria-label="Voice input">
          🎙
        </button>

        <button
          id="send-btn"
          type="submit"
          aria-label="Send message">
          ➤
        </button>

      </form>

      <p class="composer-disclaimer">
        MY AI can make mistakes. Check important information.
      </p>

    </footer>

  </main>

</div>


<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- APP -->
<script src="/app.js"></script>

</body>
</html>
